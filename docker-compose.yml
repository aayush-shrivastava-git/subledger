
services:
  db:
    image: postgres:16
    container_name: subledger_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: subledger
      POSTGRES_PASSWORD: subledger123
      POSTGRES_DB: subledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subledger -d subledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: subledger_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://subledger:subledger123@db:5432/subledger
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
